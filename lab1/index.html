<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practicing tags</title>
    <style>
        .pdiv1 {
            color: blue;
            text-align: left;
        }
        .pdiv2 {
            color: blue;
            text-align:center;
        }
        .pdiv3 {
            color: blue;
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Tags</h1>
    <hr>
    <div class="pdiv1">
        <p>Lorem ipsum</p>
        <p><a href="https://anits.edu.in" target="_top">anits website link</a></p>
    </div>
    <div class="pdiv2"><p>Lorem ipsum <br></p></div>
    <div class="pdiv3"><p>Lorem ipsum <br></p></div>
    <table>
        <th>hi</th>
        <th>hello</th>
        <th>hii</th>
        <tr>
            <td>short for hello</td>
            <td>full form of hello</td>
            <td>typo of hi</td>
        </tr>
    </table>
</body>
</html>
